<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><rect width="800" height="600" fill="#EEF3FC"/>
<g transform="translate(400,320)">
  <!-- 支柱 -->
  <rect x="-4" y="-150" width="8" height="200" fill="#1E3A8A"/>
  <!-- 横棒 -->
  <rect x="-180" y="-152" width="360" height="6" fill="#1E3A8A"/>
  <!-- 左皿(実績) -->
  <line x1="-150" y1="-148" x2="-150" y2="-100" stroke="#1E3A8A" stroke-width="2"/>
  <path d="M-200,-100 L-100,-100 L-115,-70 L-185,-70 Z" fill="#4169E1"/>
  <text x="-150" y="-83" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="white">実績</text>
  <!-- 右皿(予算) -->
  <line x1="150" y1="-148" x2="150" y2="-110" stroke="#1E3A8A" stroke-width="2"/>
  <path d="M100,-110 L200,-110 L185,-80 L115,-80 Z" fill="#93B4F0"/>
  <text x="150" y="-93" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">予算</text>
  <!-- 台座 -->
  <rect x="-60" y="50" width="120" height="14" fill="#1E3A8A"/>
  <rect x="-80" y="64" width="160" height="8" fill="#1E3A8A"/>
  <!-- 目盛り(下) -->
  <g transform="translate(0,100)" stroke="#B8924F" stroke-width="2">
    <line x1="-140" y1="0" x2="140" y2="0"/>
    <line x1="-140" y1="-5" x2="-140" y2="5"/>
    <line x1="-70" y1="-5" x2="-70" y2="5"/>
    <line x1="0" y1="-8" x2="0" y2="8"/>
    <line x1="70" y1="-5" x2="70" y2="5"/>
    <line x1="140" y1="-5" x2="140" y2="5"/>
  </g>
  <!-- 差分インジケーター(▲) -->
  <polygon points="-20,120 20,120 0,140" fill="#B8924F"/>
</g>
</svg>