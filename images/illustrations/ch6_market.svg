<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
<rect width="800" height="600" fill="#EEF3FC"/>
<!-- グリッド -->
<g stroke="#4169E1" stroke-width="1" opacity="0.12">
  <line x1="0" y1="150" x2="800" y2="150"/>
  <line x1="0" y1="300" x2="800" y2="300"/>
  <line x1="0" y1="450" x2="800" y2="450"/>
  <line x1="200" y1="0" x2="200" y2="600"/>
  <line x1="400" y1="0" x2="400" y2="600"/>
  <line x1="600" y1="0" x2="600" y2="600"/>
</g>
<g transform="translate(400,280)">
  <!-- 北海道本体(東西に広い不規則形、菱形ベース) -->
  <path d="M -210,-30
           L -180,-90
           L -100,-110
           L 0,-115
           L 100,-105
           L 180,-80
           L 220,-30
           L 210,30
           L 170,70
           L 80,90
           L -30,85
           L -120,70
           L -190,40
           L -210,-30 Z" 
        fill="#4169E1" stroke="#1E3A8A" stroke-width="1.5"/>
  <!-- 知床半島(右上の細い突起) -->
  <path d="M 195,-65 L 240,-100 L 250,-85 L 220,-55 Z" fill="#4169E1" stroke="#1E3A8A" stroke-width="1.5"/>
  <!-- 根室半島(右の突起) -->
  <path d="M 215,15 L 250,30 L 245,50 L 210,40 Z" fill="#4169E1" stroke="#1E3A8A" stroke-width="1.5"/>
  <!-- 渡島半島(南西の伸び) -->
  <path d="M -180,40
           L -200,90
           L -185,140
           L -150,160
           L -120,150
           L -115,120
           L -135,90
           L -155,60
           L -180,40 Z" 
        fill="#4169E1" stroke="#1E3A8A" stroke-width="1.5"/>
  <!-- 積丹半島(西の小さい突起) -->
  <path d="M -205,-15 L -230,-25 L -225,-5 L -205,0 Z" fill="#4169E1" stroke="#1E3A8A" stroke-width="1.5"/>
  <!-- ラベル: 主要3エリアにピン -->
  <!-- 小樽(西やや北) -->
  <g transform="translate(-130,-30)">
    <path d="M0,-22 Q-14,-22 -14,-8 Q-14,5 0,22 Q14,5 14,-8 Q14,-22 0,-22 Z" fill="#B8924F" stroke="#1E3A8A" stroke-width="2"/>
    <circle cx="0" cy="-8" r="4.5" fill="white"/>
  </g>
  <text x="-130" y="-58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">OTARU</text>
  <!-- ニセコ(小樽より南西) -->
  <g transform="translate(-145,20)">
    <path d="M0,-22 Q-14,-22 -14,-8 Q-14,5 0,22 Q14,5 14,-8 Q14,-22 0,-22 Z" fill="#B8924F" stroke="#1E3A8A" stroke-width="2"/>
    <circle cx="0" cy="-8" r="4.5" fill="white"/>
  </g>
  <text x="-145" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">NISEKO</text>
  <!-- 富良野(中央) -->
  <g transform="translate(20,-30)">
    <path d="M0,-22 Q-14,-22 -14,-8 Q-14,5 0,22 Q14,5 14,-8 Q14,-22 0,-22 Z" fill="#B8924F" stroke="#1E3A8A" stroke-width="2"/>
    <circle cx="0" cy="-8" r="4.5" fill="white"/>
  </g>
  <text x="20" y="-58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">FURANO</text>
</g>
<!-- 方位コンパス -->
<g transform="translate(700,100)">
  <circle cx="0" cy="0" r="24" fill="white" stroke="#1E3A8A" stroke-width="2"/>
  <polygon points="0,-20 6,0 0,20 -6,0" fill="#B8924F" stroke="#1E3A8A" stroke-width="1"/>
  <text x="0" y="-32" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1E3A8A">N</text>
</g>
<!-- HOKKAIDO ラベル -->
<text x="400" y="500" text-anchor="middle" font-family="serif" font-size="20" font-weight="700" fill="#1E3A8A" letter-spacing="4">HOKKAIDO</text>
</svg>