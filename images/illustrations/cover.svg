<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><rect width="800" height="600" fill="#EEF3FC"/>
<!-- 大地のレイヤー(波) -->
<path d="M0,500 Q200,460 400,490 T800,470 L800,600 L0,600 Z" fill="#1E3A8A" opacity="0.85"/>
<path d="M0,520 Q250,490 500,510 T800,500 L800,600 L0,600 Z" fill="#4169E1" opacity="0.7"/>
<!-- 雪の結晶 中央大 -->
<g transform="translate(400,260)" stroke="#1E3A8A" stroke-width="2.5" fill="none" stroke-linecap="round">
  <g id="arm">
    <line x1="0" y1="0" x2="0" y2="-130"/>
    <line x1="0" y1="-50" x2="-15" y2="-65"/>
    <line x1="0" y1="-50" x2="15" y2="-65"/>
    <line x1="0" y1="-85" x2="-20" y2="-100"/>
    <line x1="0" y1="-85" x2="20" y2="-100"/>
  </g>
  <use href="#arm" transform="rotate(60)"/>
  <use href="#arm" transform="rotate(120)"/>
  <use href="#arm" transform="rotate(180)"/>
  <use href="#arm" transform="rotate(240)"/>
  <use href="#arm" transform="rotate(300)"/>
  <circle r="6" fill="#B8924F"/>
</g>
<!-- 小さい結晶 周辺に散らす -->
<g fill="#4169E1" opacity="0.4">
  <circle cx="150" cy="120" r="4"/>
  <circle cx="600" cy="180" r="3"/>
  <circle cx="700" cy="80" r="5"/>
  <circle cx="80" cy="300" r="3"/>
  <circle cx="680" cy="380" r="4"/>
  <circle cx="220" cy="200" r="3"/>
</g>
<!-- 地球儀的なアーク -->
<g stroke="#4169E1" stroke-width="1.5" fill="none" opacity="0.35">
  <ellipse cx="400" cy="260" rx="180" ry="180"/>
  <ellipse cx="400" cy="260" rx="180" ry="60"/>
  <ellipse cx="400" cy="260" rx="120" ry="180"/>
</g>
</svg>