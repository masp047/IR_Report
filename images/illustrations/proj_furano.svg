<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><rect width="800" height="600" fill="#EEF3FC"/>
<defs>
  <linearGradient id="skyF" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#93B4F0" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="800" height="600" fill="url(#skyF)"/>
<!-- 雲 -->
<g fill="white" opacity="0.85">
  <ellipse cx="180" cy="100" rx="60" ry="18"/>
  <ellipse cx="500" cy="80" rx="80" ry="20"/>
  <ellipse cx="680" cy="140" rx="50" ry="15"/>
</g>
<!-- 遠景の山 -->
<polygon points="0,280 200,180 400,260 600,170 800,260 800,320 0,320" fill="#1E3A8A" opacity="0.4"/>
<!-- 丘(緑) -->
<path d="M0,320 Q200,280 400,310 T800,300 L800,600 L0,600 Z" fill="#6B8E4E"/>
<!-- ラベンダー畑の帯 -->
<g>
  <!-- 紫の畝(遠) -->
  <path d="M0,380 Q200,360 400,375 T800,370 L800,400 L0,400 Z" fill="#9B7BAA"/>
  <!-- 緑の畝 -->
  <path d="M0,420 Q200,405 400,415 T800,410 L800,440 L0,440 Z" fill="#7BA968"/>
  <!-- 紫の畝(中) -->
  <path d="M0,460 Q200,445 400,455 T800,450 L800,490 L0,490 Z" fill="#7A5C92"/>
  <!-- 緑の畝 -->
  <path d="M0,510 Q200,500 400,505 T800,500 L800,540 L0,540 Z" fill="#6B9658"/>
  <!-- 紫の畝(近) -->
  <path d="M0,560 Q200,555 400,558 T800,555 L800,600 L0,600 Z" fill="#1E3A8A" opacity="0.65"/>
</g>
<!-- ラベンダーの花(手前) -->
<g fill="#B8924F">
  <circle cx="140" cy="370" r="3"/>
  <circle cx="280" cy="365" r="3"/>
  <circle cx="450" cy="368" r="3"/>
  <circle cx="620" cy="362" r="3"/>
</g>
<!-- 太陽(温かみ) -->
<circle cx="650" cy="120" r="35" fill="#B8924F" opacity="0.85"/>
<circle cx="650" cy="120" r="50" fill="#B8924F" opacity="0.2"/>
</svg>