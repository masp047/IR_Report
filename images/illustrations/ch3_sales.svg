<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><rect width="800" height="600" fill="#EEF3FC"/>
<g transform="translate(140,150)">
  <!-- グリッド -->
  <g stroke="#4169E1" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="0" x2="520" y2="0"/>
    <line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="240" x2="520" y2="240"/>
  </g>
  <!-- 軸 -->
  <line x1="0" y1="0" x2="0" y2="280" stroke="#1E3A8A" stroke-width="2"/>
  <line x1="0" y1="280" x2="520" y2="280" stroke="#1E3A8A" stroke-width="2"/>
  <!-- 予算ライン(薄) -->
  <path d="M0,200 L70,180 L140,170 L210,140 L280,130 L350,100 L420,80 L490,40" 
        stroke="#93B4F0" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
  <!-- 実績ライン(濃) -->
  <path d="M0,210 L70,170 L140,160 L210,120 L280,110 L350,70 L420,50 L490,20" 
        stroke="#4169E1" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 実績ポイント -->
  <g fill="#1E3A8A">
    <circle cx="0" cy="210" r="5"/>
    <circle cx="70" cy="170" r="5"/>
    <circle cx="140" cy="160" r="5"/>
    <circle cx="210" cy="120" r="5"/>
    <circle cx="280" cy="110" r="5"/>
    <circle cx="350" cy="70" r="5"/>
    <circle cx="420" cy="50" r="5"/>
    <circle cx="490" cy="20" r="7" fill="#B8924F"/>
  </g>
  <!-- 上昇矢印 -->
  <g transform="translate(500,40)">
    <path d="M0,0 L20,-20 M20,-20 L8,-22 M20,-20 L18,-8" stroke="#B8924F" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</g>
</svg>