<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><rect width="800" height="600" fill="#EEF3FC"/>
<g transform="translate(220,150)">
  <!-- カレンダー本体 -->
  <rect x="0" y="0" width="360" height="320" fill="white" stroke="#1E3A8A" stroke-width="3" rx="6"/>
  <!-- ヘッダー帯 -->
  <rect x="0" y="0" width="360" height="60" fill="#1E3A8A" rx="6"/>
  <rect x="0" y="40" width="360" height="20" fill="#1E3A8A"/>
  <!-- リング(綴じ) -->
  <circle cx="60" cy="-10" r="6" fill="#1E3A8A"/>
  <circle cx="300" cy="-10" r="6" fill="#1E3A8A"/>
  <line x1="60" y1="-10" x2="60" y2="20" stroke="#1E3A8A" stroke-width="4"/>
  <line x1="300" y1="-10" x2="300" y2="20" stroke="#1E3A8A" stroke-width="4"/>
  <!-- 月表記 -->
  <text x="180" y="40" text-anchor="middle" font-family="serif" font-size="22" font-weight="700" fill="white">SCHEDULE</text>
  <!-- 曜日 -->
  <g font-family="sans-serif" font-size="11" font-weight="600" fill="#1E3A8A">
    <text x="30" y="85" text-anchor="middle">S</text>
    <text x="80" y="85" text-anchor="middle">M</text>
    <text x="130" y="85" text-anchor="middle">T</text>
    <text x="180" y="85" text-anchor="middle">W</text>
    <text x="230" y="85" text-anchor="middle">T</text>
    <text x="280" y="85" text-anchor="middle">F</text>
    <text x="330" y="85" text-anchor="middle">S</text>
  </g>
  <!-- 日付グリッド -->
  <g font-family="sans-serif" font-size="14" fill="#1E3A8A"><text x="130" y="120" text-anchor="middle">1</text><text x="180" y="120" text-anchor="middle">2</text><text x="230" y="120" text-anchor="middle">3</text><text x="280" y="120" text-anchor="middle">4</text><text x="330" y="120" text-anchor="middle">5</text><text x="30" y="160" text-anchor="middle">6</text><text x="80" y="160" text-anchor="middle">7</text><circle cx="130" cy="156" r="14" fill="#4169E1"/><text x="130" y="160" text-anchor="middle" fill="white" font-weight="700">8</text><text x="180" y="160" text-anchor="middle">9</text><text x="230" y="160" text-anchor="middle">10</text><text x="280" y="160" text-anchor="middle">11</text><text x="330" y="160" text-anchor="middle">12</text><text x="30" y="200" text-anchor="middle">13</text><text x="80" y="200" text-anchor="middle">14</text><circle cx="130" cy="196" r="14" fill="#B8924F"/><text x="130" y="200" text-anchor="middle" fill="white" font-weight="700">15</text><text x="180" y="200" text-anchor="middle">16</text><text x="230" y="200" text-anchor="middle">17</text><text x="280" y="200" text-anchor="middle">18</text><text x="330" y="200" text-anchor="middle">19</text><text x="30" y="240" text-anchor="middle">20</text><text x="80" y="240" text-anchor="middle">21</text><circle cx="130" cy="236" r="14" fill="#B8924F"/><text x="130" y="240" text-anchor="middle" fill="white" font-weight="700">22</text><text x="180" y="240" text-anchor="middle">23</text><text x="230" y="240" text-anchor="middle">24</text><text x="280" y="240" text-anchor="middle">25</text><text x="330" y="240" text-anchor="middle">26</text><text x="30" y="280" text-anchor="middle">27</text><text x="80" y="280" text-anchor="middle">28</text><text x="130" y="280" text-anchor="middle">29</text><text x="180" y="280" text-anchor="middle">30</text>
  </g>
</g>
</svg>