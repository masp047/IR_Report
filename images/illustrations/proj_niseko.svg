<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><rect width="800" height="600" fill="#EEF3FC"/>
<!-- 空のグラデ -->
<defs>
  <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#93B4F0" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="white" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="800" height="600" fill="url(#skyN)"/>
<!-- 後ろの山 -->
<polygon points="100,500 280,200 460,500" fill="#93B4F0" opacity="0.6"/>
<polygon points="100,500 280,200 280,260 200,360 150,500" fill="white" opacity="0.7"/>
<!-- 中央の山(メイン) -->
<polygon points="240,520 460,140 680,520" fill="#4169E1"/>
<polygon points="240,520 460,140 460,260 380,400 320,520" fill="white" opacity="0.9"/>
<polygon points="430,200 460,140 490,200 470,240 450,240" fill="#1E3A8A"/>
<!-- 右の山 -->
<polygon points="500,520 640,280 780,520" fill="#1E3A8A" opacity="0.7"/>
<polygon points="500,520 640,280 640,340 580,440 540,520" fill="white" opacity="0.6"/>
<!-- 地面 -->
<rect x="0" y="500" width="800" height="100" fill="white"/>
<!-- 雪片 -->
<g fill="white" stroke="#4169E1" stroke-width="0.8">
  <circle cx="120" cy="80" r="5"/>
  <circle cx="200" cy="150" r="4"/>
  <circle cx="350" cy="60" r="6"/>
  <circle cx="550" cy="120" r="5"/>
  <circle cx="680" cy="80" r="4"/>
  <circle cx="730" cy="180" r="5"/>
  <circle cx="80" cy="220" r="4"/>
  <circle cx="430" cy="100" r="4"/>
</g>
</svg>