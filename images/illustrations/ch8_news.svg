<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><rect width="800" height="600" fill="#EEF3FC"/>
<!-- 新聞 -->
<g transform="translate(180,170)">
  <rect x="0" y="0" width="320" height="280" fill="white" stroke="#1E3A8A" stroke-width="3"/>
  <!-- ヘッドライン -->
  <rect x="20" y="20" width="280" height="40" fill="#1E3A8A"/>
  <text x="160" y="48" text-anchor="middle" font-family="serif" font-size="20" font-weight="700" fill="white">NEWS</text>
  <!-- 記事タイトル -->
  <rect x="20" y="80" width="200" height="6" fill="#1E3A8A"/>
  <rect x="20" y="92" width="240" height="6" fill="#1E3A8A" opacity="0.7"/>
  <!-- 写真エリア -->
  <rect x="20" y="115" width="120" height="85" fill="#93B4F0"/>
  <circle cx="80" cy="155" r="20" fill="#4169E1"/>
  <!-- 本文ライン -->
  <g fill="#1E3A8A" opacity="0.4">
    <rect x="155" y="120" width="145" height="4"/>
    <rect x="155" y="130" width="145" height="4"/>
    <rect x="155" y="140" width="130" height="4"/>
    <rect x="155" y="150" width="145" height="4"/>
    <rect x="155" y="160" width="120" height="4"/>
    <rect x="155" y="170" width="145" height="4"/>
    <rect x="155" y="180" width="140" height="4"/>
    <rect x="155" y="190" width="135" height="4"/>
  </g>
  <g fill="#1E3A8A" opacity="0.4">
    <rect x="20" y="215" width="280" height="4"/>
    <rect x="20" y="225" width="280" height="4"/>
    <rect x="20" y="235" width="260" height="4"/>
    <rect x="20" y="245" width="280" height="4"/>
    <rect x="20" y="255" width="200" height="4"/>
  </g>
</g>
<!-- 電波(右上から発信) -->
<g transform="translate(620,140)" stroke="#B8924F" stroke-width="3" fill="none" stroke-linecap="round">
  <circle cx="0" cy="0" r="6" fill="#B8924F" stroke="none"/>
  <path d="M-15,-15 A20,20 0 0,1 15,-15"/>
  <path d="M-25,-25 A35,35 0 0,1 25,-25" opacity="0.6"/>
  <path d="M-35,-35 A50,50 0 0,1 35,-35" opacity="0.35"/>
</g>
</svg>